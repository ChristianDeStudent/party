<!DOCTYPE html>
<html lang="Be-nl">
<head>
    <meta charset="UTF-8">
    <title>Partylist</title>
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<!---Header---->
<div th:replace="~{fragments/header :: navbar}"></div>
<!--Main-->
<h2 class="m-2 p-2">parties</h2>
<div class="row">
    <div th:each="party: ${parties}"
    th:object="${party}"
    class="card-group col col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2">
        <div class="card m-2">
            <a th:href="@{|/partylist/*{id}|}"
            class="btn d-flex flex-column h-50">
                <div class="card-body">
                    <h5 class="card-title pb-2" th:text="${party.name}">Naam</h5>
                    <p th:text="${#temporals.format(party.date, 'dd/MM/yyyy')}"></p>
                </div>
                <img th:src="@{${party.imageUrl}}"
                class="card-img-top"
                alt="Party image">
            </a>
        </div>
    </div>
</div>

<!----Footer---->
<div th:replace="~{fragments/footer :: footer}"></div>

<!---Bootstrap js link---->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
