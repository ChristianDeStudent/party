<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<header>
    <nav class="navbar navbar-expand-sm bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand">Christian</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/home}">Home</a>
                    </li>
                    <li class="nav-item active" aria-current="page">
                        <a class="nav-link" th:href="@{/venuedetails}">zaaldetails</a>
                        </li>
                    <li class="nav-item">
                        <a class="nav-link"  th:href="@{about}">About me</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
</header>
<!--Dit typen we dan als we zeggen dat we willen werken met onze object--->
<main class="container" th:object="${venue}">
    <!---Dit betekent dat het model-attribute met key venue actief is in deze html-element(page)--->
    <h2 th:text="*{venueName}">Hier komt de naam</h2>
    <!---@ vertelt thymeleaf maak hier een geldige url van -->
    <!--* vertelt thymeleaf: kijk in het geselecteerde object (venue)--->
    <a th:href="@{*{linkMoreInfo}}">zie de link</a>

    <div class="container-fluid">
        <img th:src="@{/Img/img.png}" th:alt="test" class="img-fluid mx-0 px-0">
        <h3>Faciliteiten</h3>
        <div class="row">
            <!---Ik vraag hiermee een variabele op die rechtstreeks vanuit je javacontroller aan het model is toegevoegd.-->
            <div class="col border" th:text="|max ${venue.capacity} personen|">max 150 personen</div>
            <!-- zoek in het hele model naar het object venue en pak daar de capacity aan--->
            <div class="col border" th:text="|${venue.distanceFromPublicTransportInKm} van openbaar vervoer|">2km van openbaar vervoer</div>
        </div>
        <div class="row">
            <div class="col border" th:text="'eten voorzien: ' + (${venue.foodProvided} ? 'ja' : 'nee')">eten voorzien: ja</div>
            <div class="col border" th:text="'binnen: ' + (${venue.indoor} ? 'ja' : 'nee')">binnen : ja</div>
        </div>
        <div class="row">
            <div class="col border" th:text="'buiten: ' + (${venue.outdoor} ? 'ja' : 'nee')">buiten : nee</div>
            <div class="col border" th:text="'gratis parking: ' + (${venue.freeParkingAvailable} ? 'ja' : 'nee')">gratis parking: ja</div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
