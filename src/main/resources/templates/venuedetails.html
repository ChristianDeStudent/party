<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<!---header--->
<div th:replace="~{fragments/header :: navbar}"></div>
<!---main--->
<main class="container" th:object="${venue}" th:unless="${venue}">
    <p>geen geldige zaal gekozen</p>
    <br/>
    <a href="/venuelist">Terug naar overzicht</a>
</main>

<!--Dit typen we dan als we zeggen dat we willen werken met onze object--->
<main class="container" th:object="${venue}" th:if="${venue}">
   <div class="row mt-3 mb-3">
       <div class="col-12 d-flex justify-content-between align-items-center">
           <a th:href="@{|/venuedetails/${prevVenues}|}" class="btn btn-outline-primary shadow-sm">
               &lt;
           </a>
           <h4 class="text-muted mb-0" th:text="*{city}">Stad</h4>
           <a th:href="@{|/venuedetails/${nextVenues}}" class="btn btn-primary shadow-sm">
               &gt;
           </a>
       </div>
   </div>
    <!---Dit betekent dat het model-attribute met key venue actief is in deze html-element(page)--->
    <h2 th:text="*{venueName}">Hier komt de naam</h2>
    <!---@ vertelt thymeleaf maak hier een geldige url van -->
    <!--* vertelt thymeleaf: kijk in het geselecteerde object (venue)--->
    <a th:href="@{*{linkMoreInfo}}">zie de link</a>



<!--    <img th:src="@{${venue.imageUrl}}" alt="Venue image" />-->
    <div class="container-fluid">
        <div class="col col-12 col-sm-6 col-md-6 col-lg-4 col-xl-4 mx-0 px-0">
            <!---Het buitenste deel @: het vertelt thymeleaf:dit is een url-->
            <!---het binneste deel $: het vertelt thymeleaf: ge naar mijn java-code en haal daar de waarde van deze variebele op-->
            <!---de combinatie @{${}}--->
            <!---1. thyme kijkt naar ${venue.imageUrl},hij gaa naar de java-object(venue),roept getimageurl() aan en krijgt de string van de img--->
            <!---2.het buitenste.nu staat er eigenlijk @{img/zaal1.jpg}--->
            <!---3. thyme maakt er een officiele web-adres van--->
            <img th:src="@{${venue.imageUrl}}" alt="Venue image" class="img-fluid mx-0 px-0">        </div>
        <h3>Faciliteiten</h3>
        <div class="row">
            <!---Ik vraag hiermee een variabele op die rechtstreeks vanuit je javacontroller aan het model is toegevoegd.-->
            <div class="col border" th:text="|max ${venue.capacity} personen|">max 150 personen</div>
            <!-- zoek in het hele model naar het object venue en pak daar de capacity aan--->
            <div class="col border" th:text="|${venue.distanceFromPublicTransportInKm} km van openbaar vervoer|">2km van openbaar vervoer</div>
        </div>
        <div class="row">
<!--            <div class="col border" th:text="'eten voorzien: ' + (${venue.foodProvided} ? 'ja' : 'nee')">eten voorzien: ja</div>-->
            <div class="col border" th:if="${venue.foodProvided}">eten is voorzien</div>
            <div class="location check">
<!--                <div class="col border" th:text="'binnen: ' + (${venue.indoor} ? 'ja' : 'nee')">binnen : ja</div>-->
                <div class="col border" th:if="${venue.indoor && venue.outdoor}">binnen && buiten</div>
            </div>
            <div class="row">
                <div class="col border" th:if="${venue.outdoor && !venue.indoor}">alleen buiten</div>
                <div class="col border" th:if="${venue.indoor && !venue.outdoor}">alleen binnen</div>
                <div class="col border" th:if="${venue.freeParkingAvailable}">gratis parking</div>
<!--                <div class="col border" th:text="'buiten: ' + (${venue.outdoor} ? 'ja' : 'nee')">buiten : nee</div>-->
<!--                <div class="col border" th:text="'gratis parking: ' + (${venue.freeParkingAvailable} ? 'ja' : 'nee')">gratis parking: ja</div>-->
            </div>
            <h3>parties in De Kuub</h3>
            <div class="row">
               <div th:each="p : ${venue.parties}" class="col-md-4 mb-3">
                   <div class="card p-3 border shadow-sm">
                       <h5 class="fw-bold" th:text="${p.name}"></h5>
                       <p class="text-muted mb-0"
                       th:text="${#temporals.format(p.date, 'dd/MM/yyyy')}"></p>
                   </div>
               </div>
            </div>
        </div>

    </div>


    <br/>
    <a href="/venuelist">Terug naar overzicht</a>

</main>


<!---Footer--->
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
