<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VenueList</title>
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
<!---header--->
<div th:replace="~{fragments/header :: navbar}"></div>
<!-----Main----->
<h2 class="m-2 p-2">Zalen</h2>
<p class="text-muted ms-2" th:text="|${venues.size()} zalen gevonden|"></p>
<!-- Button trigger modal -->
<button type="button" class="btn btn-primary ms-2" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
filters
</button>

<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">

        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">Filters</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/venuelist}">
                <div class="modal-body mx-2">
                    <div class="row border rounded mt-3">
                        <div class="col-12 p-1">
                            <h5>capaciteit</h5>
                        </div>
                        <div class="col-12 p-1">
                            <label class="form-label">minimum</label>
                            <div class="input-group">
                                <input type="number"
                                       aria-label="minimum capaciteit"
                                       name="minCapacity"
                                       step="50"
                                        th:value="${param.minCapacity}">
                                <!----th:value zegt:"Kijk in de url naar de parameter minCapacity en zet die waarde hier neer---->
                                <span class="input-group-text">personen</span>
                            </div>
                            <label class="form-label">maximum</label>
                            <div class="input-group">
                                <input type="number"
                                        aria-label="maximum capaciteit"
                                        name="maxCapacity"
                                        step="50"
                                        th:value="${param.maxCapacity}">
                                <span class="input-group-text">personen</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 p-1">
                        <h5>afstand van openbaar vervoer</h5>
                    </div>
                    <div class="input-group">
                        <input type="number"
                        aria-label="maximum afstand"
                        name="maxDistance"
                        th:value="${param.maxDistance}"
                        class="form-control"
                        placeholder="Max afstand"
                        >
                        <span class="input-group-text">km maximum</span>
                    </div>
                    <div class="col-12 p-1">
                        <h5>eten mogelijk</h5>
                    </div>
                    <div class="row g-0">
                        <div class="col-4 p-1">
                        <div class="input-group p-1">
                            <div class="input-group-text">
                                <input type="radio"
                                       aria-label="maakt niet uit"
                                       name="filterFood"
                                       class="form-check-input mt-0"
                                        value=""
                                        th:checked="${param.filterFood == null or param.filterFood[0] == ''}">
                            </div>
                            <span class="input-group-text">maakt niet uit</span>
                        </div>
                    </div>

                        <div class="col-4 p-1">
                            <div class="input-group p-1">
                                <div class="input-group-text">
                                    <input type="radio"
                                           aria-label="ja"
                                           name="filterFood"
                                           value="true"
                                           th:checked="${param.filterFood !=null and param.filterFood[0] == 'true'}"
                                           class="form-check-input mt-0">
                                    <!--Zet dit vinkje aan alleen als de gebruiker op 'ja' heeft geklikt--->
                                </div>
                                <span class="input-group-text">ja</span>
                            </div>
                        </div>

                        <div class="col-4 p-1">
                            <div class="input-group p-1">
                                <div class="input-group-text">
                                    <input type="radio"
                                           aria-label="nee"
                                           name="filterFood"
                                           value="false"
                                           th:checked="${param.filterFood != null and param.filterFood[0] == 'false'}"
                                           class="form-check-input mt-0">
                                </div>
                                <span class="input-group-text">nee</span></div>
                        </div>
                    </div>
                    <div class="row g-0 border rounded mt-3">
                        <div class="col-12 p-1">
                            <h5>binnen</h5>
                        </div>
                        <div class="col-4 p1">
                            <div class="input-group p-1">
                                <div class="input-group-text">
                                    <input type="radio"
                                    aria-label="maakt niet uit"
                                    value=""
                                    class="form-check-input mt-0"
                                    name="filterInside">
                                </div>
                                <span class="input-group-text">maakt niet uit</span>
                            </div>
                        </div>
                        <div class="col-4 p1">
                            <div class="input-group p-1">
                                <div class="input-group-text">
                                    <input type="radio"
                                           aria-label="maakt niet uit"
                                           value="true"
                                           class="form-check-input mt-0"
                                           name="filterInside">
                                </div>
                                <span class="input-group-text">ja</span>
                            </div>
                        </div>
                        <div class="col-4 p1">
                            <div class="input-group p-1">
                                <div class="input-group-text">
                                    <input type="radio"
                                           aria-label="maakt niet uit"
                                           value="false"
                                           class="form-check-input mt-0"
                                           name="filterInside">
                                </div>
                                <span class="input-group-text">nee</span>
                            </div>
                        </div>
                    </div>
                    <div class="row g-0 border rounded mt-3">
                        <div class="col-12 p-1">
                            <h5>buiten</h5>
                        </div>
                        <div class="col-4 p1">
                            <div class="input-group p-1">
                                <div class="input-group-text">
                                    <input type="radio"
                                           aria-label="maakt niet uit"
                                           value=""
                                           class="form-check-input mt-0"
                                           name="filterOutside">
                                </div>
                                <span class="input-group-text">maakt niet uit</span>
                            </div>
                        </div> <div class="col-4 p1">
                        <div class="input-group p-1">
                            <div class="input-group-text">
                                <input type="radio"
                                       aria-label="ja"
                                       value="true"
                                       class="form-check-input mt-0"
                                       name="filterOutside">
                            </div>
                            <span class="input-group-text">ja</span>
                        </div>
                    </div> <div class="col-4 p1">
                        <div class="input-group p-1">
                            <div class="input-group-text">
                                <input type="radio"
                                       aria-label="nee"
                                       value="false"
                                       class="form-check-input mt-0"
                                       name="filterOutside">
                            </div>
                            <span class="input-group-text">nee</span>
                        </div>
                    </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Zoek</button>
                </div>
            </form>

        </div>
    </div>
</div>
<div class="row">
    <div th:each="venue: ${venues}"
    th:object="${venue}"
    class="card-group col col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2">
        <div class="card m-1 p-2 text-center">
            <a th:href="@{|/venuedetails/*{id}|}"
            class="btn d-flex flex-column h-100">
                <h3 th:text="*{venueName}"></h3>
                <p th:text="|max ${venue.capacity} personen|"></p>
                <img th:src="@{${venue.imageUrl}}" alt="Venue image" class="img-fluid mx-0 px-0">        </div>

        </a>
        </div>
    </div>
</div>

<!--        <div class="col border p-2 m-2"> <a href="/venuedetails/1">Zaal 1</a></div>-->

<!--        <div class="col border p-2 m-2"> <a href="/venuedetails/3">Zaal 3</a></div>-->
<!--    </div>-->
<!--</main>-->
<!---Footer--->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
