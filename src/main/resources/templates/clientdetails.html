<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Klantgegevens</h1>
    <div th:if="${client != null}">
        <p><strong>Naam:</strong> <span th:text="${client.name}">Naam</span></p>
        <p><strong>Totaal besteed:</strong> €<span th:text="${client.totalAmount}">0.00</span></p>
        <p><strong>Aantal bestellingen:</strong> <span th:text="${client.nrOfOrders}">0</span></p>

        <div class="alert alert-info">
            <strong>Berekende korting voor deze klant:</strong>
            €<span th:text="${#numbers.formatDecimal(calculatedDiscount, 1, 2)}">0.00</span>
        </div>
    </div>
    <div th:unless="${client != null}">
        <p>Klant niet gevonden.</p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
